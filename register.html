<!DOCTYPE html>
<html lang="en">

<body class="regbackground">
   <div>
   <img src="imgReg.jpg" alt="">
        <div class="log">
      <a href="login.html">Login</a>

   </div>
   </div>
    <div class="register-card">
         <h1 style="color: white">Register</h1>
               <div class="register-input">
                 Name
               <input type="name" placeholder="Enter your name" required>
               </div>
               <div class="register-input">
                 Email address
               <input type="email-address" placeholder="Enter your email" required>
               </div>
               <div class="register-input">
                 Country
             
          <input type="text"placeholder="Enter your country" name="Enter your name" autofocus="" list="country"/>
    <datalist id="country">
        <option value="India">India</option>
        <option value="Japan">Japan</option>
        <option value="Russia">Russia</option>
        <option value="Australia">Australia</option>
        <option value="Bhutan">Bhutan</option>
        <option value="Sri Lanka">Sri Lanka</option>
    </datalist>
               </div>
               <div class="register-input">
                 Mobile
               <input type="mobile" placeholder="Enter your mobile" required>
               </div>
               <div class="register-input">
                 Password
               <input type="password" placeholder="Enter your password" required>
         <div class="creat-account"></div>
      <button type="submit" class="button3">CREAT ACCOUNT</button>
   </div>
   </div>
</div>
